---
- name: Wait for SSH to be available
  ansible.builtin.wait_for_connection:
    delay: 5
    timeout: 120

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  retries: 5
  delay: 10
  register: apt_update
  until: apt_update is succeeded

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - software-properties-common
      - acl
      - curl
      - git
      - build-essential
      - libpq-dev
    state: present

- name: Add deadsnakes PPA for Python 3.11
  ansible.builtin.apt_repository:
    repo: ppa:deadsnakes/ppa
    state: present
    update_cache: true

- name: Install Python 3.11 and system packages
  ansible.builtin.apt:
    name:
      - python3.11
      - python3.11-venv
      - python3.11-dev
      - nginx
    state: present

- name: Create app system user
  ansible.builtin.user:
    name: "{{ app_user }}"
    system: true
    shell: /bin/bash
    home: "{{ app_dir }}"
    create_home: true

- name: Create gunicorn runtime directory
  ansible.builtin.file:
    path: /run/gunicorn
    state: directory
    owner: "{{ app_user }}"
    group: www-data
    mode: "0775"

- name: Create gunicorn tmpfiles.d entry (persist across reboots)
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/gunicorn.conf
    content: "d /run/gunicorn 0775 {{ app_user }} www-data -\n"
    mode: "0644"
