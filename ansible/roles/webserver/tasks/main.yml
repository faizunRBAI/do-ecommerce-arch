---
- name: Remove default nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: reload nginx

- name: Install nginx vhost config
  ansible.builtin.template:
    src: nginx_vhost.conf.j2
    dest: /etc/nginx/sites-available/ecommerce
    mode: "0644"
  notify: reload nginx

- name: Enable nginx vhost
  ansible.builtin.file:
    src: /etc/nginx/sites-available/ecommerce
    dest: /etc/nginx/sites-enabled/ecommerce
    state: link
  notify: reload nginx

- name: Test nginx config
  ansible.builtin.command:
    cmd: nginx -t
  changed_when: false

- name: Ensure nginx is enabled and started
  ansible.builtin.service:
    name: nginx
    enabled: true
    state: started

- name: Flush handlers (reload nginx before health check)
  ansible.builtin.meta: flush_handlers

- name: Wait for app to be reachable on port 80
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 80
    timeout: 60
    state: started
