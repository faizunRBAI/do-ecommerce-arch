version: 1
name: do-ecommerce-arch
vcs: github

stages:
  - id: lint
    kind: lint
    needs: []
    timeout_minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: pip install flake8 isort
      - name: Run flake8
        run: flake8 api/ do_ecommerce_arch/ --max-line-length=120 --exclude=api/migrations,api/tests
      - name: Check import order (isort)
        run: isort --check-only api/ do_ecommerce_arch/ --skip api/migrations --skip api/tests

  - id: test
    kind: test
    needs: [lint]
    timeout_minutes: 15
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest api/tests/ -v --tb=short
        env:
          DJANGO_SETTINGS_MODULE: do_ecommerce_arch.settings
          SECRET_KEY: test-secret-key-for-ci-only
          DATABASE_URL: sqlite:///test.db

  - id: provision
    kind: provision
    needs: [test]
    timeout_minutes: 30
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
      TF_VAR_spaces_access_key: ${{ secrets.SPACES_ACCESS_KEY }}
      TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.SPACES_ENDPOINT }}
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: nyc3
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_django_secret_key: ${{ secrets.DJANGO_SECRET_KEY }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Derive Spaces backend region
        id: spaces_region
        run: |
          host="${AWS_ENDPOINT_URL_S3#https://}"
          region="${host%%.*}"
          echo "region=${region}" >> "$GITHUB_OUTPUT"
      - name: Terraform init
        working-directory: infra
        run: |
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=${{ steps.spaces_region.outputs.region }}" \
            -backend-config="endpoint=${{ secrets.SPACES_ENDPOINT }}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_path_style=true"
      - name: Terraform plan
        working-directory: infra
        run: terraform plan -input=false -out=tfplan
      - name: Terraform apply
        working-directory: infra
        run: terraform apply -input=false tfplan
      - name: Get droplet IP
        id: get_ip
        working-directory: infra
        run: |
          ip=$(terraform output -raw droplet_ip)
          echo "droplet_ip=${ip}" >> "$GITHUB_OUTPUT"
      - name: Get DB host
        id: get_db
        working-directory: infra
        run: |
          db_host=$(terraform output -raw db_host)
          echo "db_host=${db_host}" >> "$GITHUB_OUTPUT"
      - name: Get Redis host
        id: get_redis
        working-directory: infra
        run: |
          redis_host=$(terraform output -raw redis_host)
          echo "redis_host=${redis_host}" >> "$GITHUB_OUTPUT"
      - name: Get Spaces bucket
        id: get_spaces
        working-directory: infra
        run: |
          bucket=$(terraform output -raw spaces_bucket_name)
          echo "spaces_bucket=${bucket}" >> "$GITHUB_OUTPUT"
    outputs:
      droplet_ip: ${{ steps.get_ip.outputs.droplet_ip }}
      db_host: ${{ steps.get_db.outputs.db_host }}
      redis_host: ${{ steps.get_redis.outputs.redis_host }}
      spaces_bucket: ${{ steps.get_spaces.outputs.spaces_bucket }}

  - id: configure
    kind: configure
    needs: [provision]
    timeout_minutes: 25
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
      TF_VAR_spaces_access_key: ${{ secrets.SPACES_ACCESS_KEY }}
      TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.SPACES_ENDPOINT }}
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: nyc3
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_django_secret_key: ${{ secrets.DJANGO_SECRET_KEY }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Install Ansible
        run: pip install ansible-core
      - name: Install community.general collection
        run: ansible-galaxy collection install community.general
      - name: Write SSH key
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
      - name: Re-read Terraform outputs
        id: tf_outputs
        working-directory: infra
        run: |
          host="${AWS_ENDPOINT_URL_S3#https://}"
          region="${host%%.*}"
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=${region}" \
            -backend-config="endpoint=${{ secrets.SPACES_ENDPOINT }}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_path_style=true"
          droplet_ip=$(terraform output -raw droplet_ip)
          db_host=$(terraform output -raw db_host)
          db_port=$(terraform output -raw db_port)
          db_name=$(terraform output -raw db_name)
          db_user=$(terraform output -raw db_user)
          redis_host=$(terraform output -raw redis_host)
          redis_port=$(terraform output -raw redis_port)
          spaces_bucket=$(terraform output -raw spaces_bucket_name)
          spaces_region=$(terraform output -raw spaces_region)
          echo "droplet_ip=${droplet_ip}" >> "$GITHUB_OUTPUT"
          echo "db_host=${db_host}" >> "$GITHUB_OUTPUT"
          echo "db_port=${db_port}" >> "$GITHUB_OUTPUT"
          echo "db_name=${db_name}" >> "$GITHUB_OUTPUT"
          echo "db_user=${db_user}" >> "$GITHUB_OUTPUT"
          echo "redis_host=${redis_host}" >> "$GITHUB_OUTPUT"
          echo "redis_port=${redis_port}" >> "$GITHUB_OUTPUT"
          echo "spaces_bucket=${spaces_bucket}" >> "$GITHUB_OUTPUT"
          echo "spaces_region=${spaces_region}" >> "$GITHUB_OUTPUT"
      - name: Read Redis password from Terraform output
        id: redis_pw
        working-directory: infra
        run: |
          pw=$(terraform output -raw redis_password)
          echo "redis_password=${pw}" >> "$GITHUB_OUTPUT"
      - name: Scan host key
        run: |
          ssh-keyscan -H "${{ steps.tf_outputs.outputs.droplet_ip }}" >> ~/.ssh/known_hosts
      - name: Generate Ansible inventory
        run: |
          printf '[web]\n%s ansible_user=%s ansible_ssh_private_key_file=~/.ssh/deploy_key\n' \
            "${{ steps.tf_outputs.outputs.droplet_ip }}" \
            "${{ secrets.SSH_USER }}" \
            > ansible/inventory.ini
      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"
          EXTRA_DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          EXTRA_DJANGO_SECRET: ${{ secrets.DJANGO_SECRET_KEY }}
          EXTRA_SPACES_ACCESS: ${{ secrets.SPACES_ACCESS_KEY }}
          EXTRA_SPACES_SECRET: ${{ secrets.SPACES_SECRET_KEY }}
          EXTRA_REDIS_PW: ${{ steps.redis_pw.outputs.redis_password }}
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/site.yml \
            -e db_host="${{ steps.tf_outputs.outputs.db_host }}" \
            -e db_port="${{ steps.tf_outputs.outputs.db_port }}" \
            -e db_name="${{ steps.tf_outputs.outputs.db_name }}" \
            -e db_user="${{ steps.tf_outputs.outputs.db_user }}" \
            -e "db_password=$EXTRA_DB_PASSWORD" \
            -e redis_host="${{ steps.tf_outputs.outputs.redis_host }}" \
            -e redis_port="${{ steps.tf_outputs.outputs.redis_port }}" \
            -e "redis_password=$EXTRA_REDIS_PW" \
            -e spaces_bucket="${{ steps.tf_outputs.outputs.spaces_bucket }}" \
            -e spaces_region="${{ steps.tf_outputs.outputs.spaces_region }}" \
            -e "spaces_access_key=$EXTRA_SPACES_ACCESS" \
            -e "spaces_secret_key=$EXTRA_SPACES_SECRET" \
            -e "django_secret_key=$EXTRA_DJANGO_SECRET" \
            -e project_name="${{ secrets.PROJECT_NAME }}"

  - id: verify
    kind: verify
    needs: [configure]
    timeout_minutes: 10
    env:
      DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
      TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
      TF_VAR_spaces_access_key: ${{ secrets.SPACES_ACCESS_KEY }}
      TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.SPACES_ENDPOINT }}
      TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
      TF_VAR_region: nyc3
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
      TF_VAR_django_secret_key: ${{ secrets.DJANGO_SECRET_KEY }}
    steps:
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Re-read droplet IP
        id: tf_ip
        working-directory: infra
        run: |
          host="${AWS_ENDPOINT_URL_S3#https://}"
          region="${host%%.*}"
          terraform init -input=false -reconfigure \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
            -backend-config="region=${region}" \
            -backend-config="endpoint=${{ secrets.SPACES_ENDPOINT }}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_path_style=true"
          droplet_ip=$(terraform output -raw droplet_ip)
          echo "droplet_ip=${droplet_ip}" >> "$GITHUB_OUTPUT"
      - name: Health check with retries
        run: |
          curl --fail \
            --retry 15 \
            --retry-delay 20 \
            --retry-all-errors \
            "http://${{ steps.tf_ip.outputs.droplet_ip }}/health/"

rollback:
  strategy: manual

destroy:
  env:
    DIGITALOCEAN_TOKEN: ${{ secrets.DO_TOKEN }}
    TF_VAR_do_token: ${{ secrets.DO_TOKEN }}
    TF_VAR_spaces_access_key: ${{ secrets.SPACES_ACCESS_KEY }}
    TF_VAR_spaces_secret_key: ${{ secrets.SPACES_SECRET_KEY }}
    AWS_ACCESS_KEY_ID: ${{ secrets.SPACES_ACCESS_KEY }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.SPACES_SECRET_KEY }}
    AWS_ENDPOINT_URL_S3: ${{ secrets.SPACES_ENDPOINT }}
    TF_VAR_project_name: ${{ secrets.PROJECT_NAME }}
    TF_VAR_region: nyc3
    TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}
    TF_VAR_django_secret_key: ${{ secrets.DJANGO_SECRET_KEY }}
  steps:
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
    - name: Derive Spaces backend region
      id: spaces_region
      run: |
        host="${AWS_ENDPOINT_URL_S3#https://}"
        region="${host%%.*}"
        echo "region=${region}" >> "$GITHUB_OUTPUT"
    - name: Terraform init
      working-directory: infra
      run: |
        terraform init -input=false -reconfigure \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="key=${{ secrets.PROJECT_NAME }}/terraform.tfstate" \
          -backend-config="region=${{ steps.spaces_region.outputs.region }}" \
          -backend-config="endpoint=${{ secrets.SPACES_ENDPOINT }}" \
          -backend-config="skip_credentials_validation=true" \
          -backend-config="skip_requesting_account_id=true" \
          -backend-config="skip_metadata_api_check=true" \
          -backend-config="skip_region_validation=true" \
          -backend-config="skip_s3_checksum=true" \
          -backend-config="use_path_style=true"
    - name: Terraform destroy
      working-directory: infra
      run: terraform destroy -input=false -auto-approve
