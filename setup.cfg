[flake8]
max-line-length = 120
exclude =
    api/migrations,
    api/tests,
    .git,
    __pycache__,
    staticfiles,
    venv,
    .venv

[isort]
profile = black
line_length = 120
skip = api/migrations,api/tests

[tool:pytest]
DJANGO_SETTINGS_MODULE = do_ecommerce_arch.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
testpaths = api/tests
